build:
  from:
    type: docker
    url: docker://ghcr.io/project-zot/golang:1.27
  binds:
    - ../. -> /zotcopy
  run: |
    export GO111MODULE=on
    export GOPATH='/go'
    export HOME='/root'
    export PATH='/go/bin:/usr/local/go/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin'
    mkdir -p /go/src/github.com/project-zot
    cd /go/src/github.com/project-zot
    git clone /zotcopy zot
    cd /go/src/github.com/project-zot/zot
    make COMMIT=${{COMMIT}} OS=${{OS}} ARCH=${{ARCH}} RELEASE_TAG=${{RELEASE_TAG}} clean binary${{EXT:}}
    cat > config.json << EOF
    {
      "storage":{
          "rootDirectory":"/var/lib/registry"
      },
      "http":{
          "address":"0.0.0.0",
          "port":"5000"
      },
      "log":{
          "level":"debug"
      }
    }
    EOF

    cat config.json
    mkdir -p /zotcopy/.build/${{REPO_NAME}}
    cd /zotcopy/.build/${{REPO_NAME}}

    mkdir -p binary/ config/

    cp /go/src/github.com/project-zot/zot/bin/zot-${{OS}}-${{ARCH}}${{EXT:}} binary/
    cp /go/src/github.com/project-zot/zot/config.json config/
    # Static busybox the nonroot layer uses to create a real /var/lib/registry.
    # Distroless has no shell, and a directory import cannot set an owner.
    export DEBIAN_FRONTEND=noninteractive
    apt-get update
    apt-get install -y --no-install-recommends busybox-static
    cp "$(command -v busybox)" busybox
    chmod 755 busybox
  build_only: true

"${{REPO_NAME:zot}}":
  annotations:
    org.opencontainers.image.description: "OCI-native container image/artifact registry (purely based on OCI Distribution Specification)"
    org.opencontainers.image.source: "https://github.com/project-zot/zot"
  os: ${{OS}}
  arch: ${{ARCH}}
  from:
    type: docker
    url: docker://${{BASE_IMAGE}}
  overlay_dirs:
    - source: ../.build/${{REPO_NAME}}/binary
      dest: /usr/local/bin
    - source: ../.build/${{REPO_NAME}}/config
      dest: /etc/zot
  entrypoint:
    - /usr/local/bin/zot-${{OS}}-${{ARCH}}${{EXT:}}
  cmd:
    - serve
    - /etc/zot/config.json

# Opt-in nonroot image. NONROOT_BUILD_ONLY is true on FreeBSD, which has no nonroot account.
"zot-minimal-nonroot-${{OS}}-${{ARCH}}":
  annotations:
    org.opencontainers.image.description: "OCI-native container image/artifact registry (purely based on OCI Distribution Specification)"
    org.opencontainers.image.source: "https://github.com/project-zot/zot"
  os: ${{OS}}
  arch: ${{ARCH}}
  build_only: ${{NONROOT_BUILD_ONLY:false}}
  runtime_user: "65532:65532"
  from:
    type: built
    tag: ${{REPO_NAME:zot}}
  imports:
    - path: ../.build/${{REPO_NAME}}/busybox
  run:
    - |
      #!/stacker/imports/busybox sh
      set -e
      mkdir -p /var/lib/registry
      chown 65532:65532 /var/lib/registry
      chmod 755 /var/lib/registry
  entrypoint:
    - /usr/local/bin/zot-${{OS}}-${{ARCH}}${{EXT:}}
  cmd:
    - serve
    - /etc/zot/config.json
