build:
  from:
    type: docker
    url: docker://ghcr.io/project-zot/golang:1.27
  binds:
    - ../. -> /zotcopy
  run: |
    export GO111MODULE=on
    export GOPATH='/go'
    export HOME='/root'
    export PATH='/go/bin:/usr/local/go/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin'
    mkdir -p /go/src/github.com/project-zot
    cd /go/src/github.com/project-zot
    git clone /zotcopy zot
    cd /go/src/github.com/project-zot/zot
    make COMMIT=${{COMMIT}} OS=${{OS}} ARCH=${{ARCH}} RELEASE_TAG=${{RELEASE_TAG}} clean binary
    cat > config.json << EOF
    {
      "storage":{
          "rootDirectory":"/var/lib/registry"
      },
      "http":{
          "address":"0.0.0.0",
          "port":"5000",
          "compat": ["docker2s2"]
      },
      "log":{
          "level":"debug"
      },
      "extensions": {
        "search": {
            "enable": true,
            "cve": {
                "updateInterval": "2h"
            }
        },
        "ui": {
            "enable": true
        },
        "mgmt": {
          "enable": true
        }
      }
    }
    EOF

    cat config.json
    mkdir -p /zotcopy/.build/${{REPO_NAME}}
    cd /zotcopy/.build/${{REPO_NAME}}

    mkdir -p binary/ config/ registrylink/var/lib

    cp /go/src/github.com/project-zot/zot/bin/zot-${{OS}}-${{ARCH}} binary/
    cp /go/src/github.com/project-zot/zot/config.json config/
    # Distroless static has no shell, and overlay_dirs records the builder uid.
    # On Linux, /home/nonroot is already uid 65532 mode 0700, so point the
    # default storage path at it. FreeBSD stays root and gets a real directory.
    if [ "${{OS}}" = "linux" ]; then
      ln -s /home/nonroot registrylink/var/lib/registry
    else
      mkdir -p registrylink/var/lib/registry
    fi
  build_only: true

"${{REPO_NAME:zot}}":
  annotations:
    org.opencontainers.image.description: "OCI-native container image/artifact registry (purely based on OCI Distribution Specification)"
    org.opencontainers.image.source: "https://github.com/project-zot/zot"
  os: ${{OS}}
  arch: ${{ARCH}}
  from:
    type: docker
    url: docker://${{BASE_IMAGE}}
  overlay_dirs:
    - source: ../.build/${{REPO_NAME}}/binary
      dest: /usr/local/bin
    - source: ../.build/${{REPO_NAME}}/config
      dest: /etc/zot
    - source: ../.build/${{REPO_NAME}}/registrylink
      dest: /
  runtime_user: ${{RUNTIME_USER}}
  entrypoint:
    - /usr/local/bin/zot-${{OS}}-${{ARCH}}
  cmd:
    - serve
    - /etc/zot/config.json
