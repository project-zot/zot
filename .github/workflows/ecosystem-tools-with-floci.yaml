name: "Ecosystem client tools with floci"
on:
  push:
    branches:
      - main
  pull_request:
    branches: [main]
  release:
    types:
      - published

permissions: read-all

jobs:
  build:
    name: Build binaries and tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/build-zot-binaries
        with:
          make-targets: binary binary-minimal cli bench blackbox-tools
          with-skopeo-build-deps: "true"
          artifact-name: ecosystem-bins-${{ github.sha }}
          artifact-path: |
            bin/
            hack/tools/

  floci-blackbox-cloud:
    name: floci - Blackbox cloud CI
    needs: build
    runs-on: cncf-ubuntu-32-128-x86
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-prebuilt-binaries
        with:
          artifact-name: ecosystem-bins-${{ github.sha }}
      # Needed for Dex build in setup-ecosystem-tools and for Makefile/helpers `go env`.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          cache: false
          check-latest: true
          go-version-file: .go-version
      - uses: ./.github/actions/setup-ecosystem-tools
        with:
          with-docker: "true"
          with-dex: "true"

      - uses: ./.github/actions/setup-floci
      - name: Run cloud-only tests
        run: |
          make run-blackbox-cloud-ci USE_PREBUILT=1
        env:
          AWS_ACCESS_KEY_ID: fake
          AWS_SECRET_ACCESS_KEY: fake
      - uses: ./.github/actions/teardown-floci
        if: always()

  floci-scale-out-dynamodb:
    name: floci - Cloud scale-out DynamoDB
    needs: build
    runs-on: cncf-ubuntu-32-128-x86
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-prebuilt-binaries
        with:
          artifact-name: ecosystem-bins-${{ github.sha }}
      # Makefile and bats helpers resolve bin paths via `go env GOOS/GOARCH`.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          cache: false
          check-latest: true
          go-version-file: .go-version
      - uses: ./.github/actions/setup-ecosystem-tools
        with:
          with-docker: "true"
          with-haproxy: "true"

      - uses: ./.github/actions/setup-floci
      - name: Run cloud scale-out DynamoDB tests
        id: dynamodb_scale
        run: |
          make run-cloud-scale-out-tests USE_PREBUILT=1
        env:
          AWS_ACCESS_KEY_ID: fake
          AWS_SECRET_ACCESS_KEY: fake
        continue-on-error: true
      - uses: ./.github/actions/scale-out-collect-results
        if: always()
        with:
          scale-outcome: ${{ steps.dynamodb_scale.outcome }}
          logs-search-path: /tmp/zot-ft-logs
          zot-logs-artifact-name: zot-scale-out-dynamodb-logs-floci
          zot-logs-artifact-path: /tmp/zot-ft-logs
          zb-results-artifact-name: zb-cloud-scale-out-dynamodb-results-floci-${{ github.sha }}
          fail-message: DynamoDB scale-out tests failed
      - uses: ./.github/actions/teardown-floci
        if: always()

  floci-scale-out-redis:
    name: floci - Cloud scale-out Redis
    needs: build
    runs-on: cncf-ubuntu-32-128-x86
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-prebuilt-binaries
        with:
          artifact-name: ecosystem-bins-${{ github.sha }}
      # Makefile and bats helpers resolve bin paths via `go env GOOS/GOARCH`.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          cache: false
          check-latest: true
          go-version-file: .go-version
      - uses: ./.github/actions/setup-ecosystem-tools
        with:
          with-docker: "true"
          with-haproxy: "true"
          with-valkey: "true"

      - uses: ./.github/actions/setup-floci
      - name: Run cloud scale-out Redis tests
        id: redis_scale
        run: |
          make run-cloud-scale-out-redis-tests USE_PREBUILT=1
        env:
          AWS_ACCESS_KEY_ID: fake
          AWS_SECRET_ACCESS_KEY: fake
        continue-on-error: true
      - uses: ./.github/actions/scale-out-collect-results
        if: always()
        with:
          scale-outcome: ${{ steps.redis_scale.outcome }}
          logs-search-path: /tmp/zot-ft-logs/redis
          zot-logs-artifact-name: zot-scale-out-redis-logs-floci
          zot-logs-artifact-path: /tmp/zot-ft-logs
          zb-results-artifact-name: zb-cloud-scale-out-redis-results-floci-${{ github.sha }}
          fail-message: Redis scale-out tests failed
      - uses: ./.github/actions/teardown-floci
        if: always()
