name: "Ecosystem client tools with floci"
on:
  push:
    branches:
      - main
  pull_request:
    branches: [main]
  release:
    types:
      - published

permissions: read-all

jobs:
  build:
    name: Build binaries and tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install libs for skopeo build
        run: |
          sudo apt-get update
          sudo apt-get install -y libgpgme-dev libassuan-dev libbtrfs-dev \
            libdevmapper-dev pkg-config
      - uses: ./.github/actions/build-zot-binaries
        with:
          make-targets: binary binary-minimal cli bench blackbox-tools
          artifact-name: ecosystem-bins-${{ github.sha }}
          artifact-path: |
            bin/
            hack/tools/

  floci-blackbox-cloud:
    name: floci - Blackbox cloud CI
    needs: build
    runs-on: cncf-ubuntu-32-128-x86
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/download-ecosystem-bins
        with:
          artifact-name: ecosystem-bins-${{ github.sha }}
      # Needed for Dex build in setup-ecosystem-tools and for Makefile/helpers `go env`.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          cache: false
          check-latest: true
          go-version: 1.26.x
      - uses: ./.github/actions/setup-ecosystem-tools
        with:
          with-docker: "true"
          with-dex: "true"
          with-go: "false"
          with-skopeo: "false"
      - uses: ./.github/actions/setup-floci
      - name: Run cloud-only tests
        run: |
          make run-blackbox-cloud-ci USE_PREBUILT=1
        env:
          AWS_ACCESS_KEY_ID: fake
          AWS_SECRET_ACCESS_KEY: fake
      - uses: ./.github/actions/teardown-floci
        if: always()

  floci-scale-out-dynamodb:
    name: floci - Cloud scale-out DynamoDB
    needs: build
    runs-on: cncf-ubuntu-32-128-x86
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/download-ecosystem-bins
        with:
          artifact-name: ecosystem-bins-${{ github.sha }}
      # Makefile and bats helpers resolve bin paths via `go env GOOS/GOARCH`.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          cache: false
          check-latest: true
          go-version: 1.26.x
      - uses: ./.github/actions/setup-ecosystem-tools
        with:
          with-docker: "true"
          with-haproxy: "true"
          with-go: "false"
          with-skopeo: "false"
      - uses: ./.github/actions/setup-floci
      - name: Run cloud scale-out DynamoDB tests
        id: dynamodb_scale
        run: |
          make run-cloud-scale-out-tests USE_PREBUILT=1
        env:
          AWS_ACCESS_KEY_ID: fake
          AWS_SECRET_ACCESS_KEY: fake
        continue-on-error: true
      - name: Print service logs for DynamoDB scale-out
        run: |
          find /tmp/zot-ft-logs -name '*.log' -print0 | xargs -0 cat
      - name: Upload DynamoDB zot logs as build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: zot-scale-out-dynamodb-logs-floci
          path: /tmp/zot-ft-logs
          if-no-files-found: ignore
      - name: DynamoDB multi-hop detection
        id: dynamodb_multihop
        run: |
          if find /tmp/zot-ft-logs -name '*.log' -print0 | xargs -0 cat | grep 'cannot proxy an already proxied request'; then
            echo "detected multi-hop in DynamoDB tests"
            exit 1
          else
            exit 0
          fi
        continue-on-error: true
      - name: Upload zb test results zip as build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: zb-cloud-scale-out-dynamodb-results-floci-${{ github.sha }}
          path: ./zb-results/
          if-no-files-found: ignore
      - name: Fail job if DynamoDB error
        if: ${{ steps.dynamodb_scale.outcome != 'success' || steps.dynamodb_multihop.outcome != 'success' }}
        run: |
          echo "DynamoDB scale-out tests failed"
          exit 1
      - uses: ./.github/actions/teardown-floci
        if: always()

  floci-scale-out-redis:
    name: floci - Cloud scale-out Redis
    needs: build
    runs-on: cncf-ubuntu-32-128-x86
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/download-ecosystem-bins
        with:
          artifact-name: ecosystem-bins-${{ github.sha }}
      # Makefile and bats helpers resolve bin paths via `go env GOOS/GOARCH`.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          cache: false
          check-latest: true
          go-version: 1.26.x
      - uses: ./.github/actions/setup-ecosystem-tools
        with:
          with-docker: "true"
          with-haproxy: "true"
          with-valkey: "true"
          with-go: "false"
          with-skopeo: "false"
      - uses: ./.github/actions/setup-floci
      - name: Run cloud scale-out Redis tests
        id: redis_scale
        run: |
          make run-cloud-scale-out-redis-tests USE_PREBUILT=1
        env:
          AWS_ACCESS_KEY_ID: fake
          AWS_SECRET_ACCESS_KEY: fake
        continue-on-error: true
      - name: Print service logs for Redis scale-out
        run: |
          find /tmp/zot-ft-logs/redis -name '*.log' -print0 | xargs -0 cat
      - name: Upload Redis zot logs as build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: zot-scale-out-redis-logs-floci
          path: /tmp/zot-ft-logs
          if-no-files-found: ignore
      - name: Redis multi-hop detection
        id: redis_multihop
        run: |
          if find /tmp/zot-ft-logs/redis -name '*.log' -print0 | xargs -0 cat | grep 'cannot proxy an already proxied request'; then
            echo "detected multi-hop in Redis tests"
            exit 1
          else
            exit 0
          fi
        continue-on-error: true
      - name: Upload zb test results zip as build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: zb-cloud-scale-out-redis-results-floci-${{ github.sha }}
          path: ./zb-results/
          if-no-files-found: ignore
      - name: Fail job if Redis error
        if: ${{ steps.redis_scale.outcome != 'success' || steps.redis_multihop.outcome != 'success' }}
        run: |
          echo "Redis scale-out tests failed"
          exit 1
      - uses: ./.github/actions/teardown-floci
        if: always()
