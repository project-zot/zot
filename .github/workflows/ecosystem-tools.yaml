name: "Ecosystem client tools"
on:
  push:
    branches:
      - main
  pull_request:
    branches: [main]
  release:
    types:
      - published

permissions: read-all

jobs:
  build:
    name: Build binaries and tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/build-zot-binaries
        with:
          make-targets: binary binary-minimal cli bench blackbox-tools
          with-skopeo-build-deps: "true"
          artifact-name: ecosystem-bins-${{ github.sha }}
          artifact-path: |
            bin/
            hack/tools/

  blackbox-ci:
    name: Blackbox CI (${{ matrix.shard }})
    needs: build
    runs-on: cncf-ubuntu-32-128-x86
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: upgrade
            with-crio: "true"
            with-npm: "false"
            with-userns: "false"
            with-valkey: "false"
          - shard: sync
            with-crio: "false"
            with-npm: "false"
            with-userns: "false"
            with-valkey: "false"
          - shard: registry
            with-crio: "true"
            with-npm: "false"
            with-userns: "false"
            with-valkey: "false"
          - shard: host-deps
            with-crio: "false"
            with-npm: "true"
            with-userns: "true"
            with-valkey: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-prebuilt-binaries
        with:
          artifact-name: ecosystem-bins-${{ github.sha }}
      # Makefile and bats helpers resolve bin paths via `go env GOOS/GOARCH`.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          cache: false
          check-latest: true
          go-version-file: .go-version
      - uses: ./.github/actions/setup-ecosystem-tools
        with:
          with-docker: "true"
          with-crio: ${{ matrix.with-crio }}
          with-npm: ${{ matrix.with-npm }}
          with-userns: ${{ matrix.with-userns }}
          with-valkey: ${{ matrix.with-valkey }}

      - name: Run blackbox CI shard
        run: |
          make run-blackbox-ci-shard SHARD=${{ matrix.shard }} USE_PREBUILT=1

  blackbox-cloud:
    name: Blackbox cloud CI
    needs: build
    runs-on: cncf-ubuntu-32-128-x86
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-prebuilt-binaries
        with:
          artifact-name: ecosystem-bins-${{ github.sha }}
      # Needed for Dex build in setup-ecosystem-tools and for Makefile/helpers `go env`.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          cache: false
          check-latest: true
          go-version-file: .go-version
      - uses: ./.github/actions/setup-ecosystem-tools
        with:
          with-docker: "true"
          with-dex: "true"

      - uses: ./.github/actions/setup-localstack
      - name: Run cloud-only tests
        run: |
          make run-blackbox-cloud-ci USE_PREBUILT=1
        env:
          AWS_ACCESS_KEY_ID: fake
          AWS_SECRET_ACCESS_KEY: fake
      - uses: ./.github/actions/teardown-localstack
        if: always()

  scale-out-dynamodb:
    name: Cloud scale-out DynamoDB
    needs: build
    runs-on: cncf-ubuntu-32-128-x86
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-prebuilt-binaries
        with:
          artifact-name: ecosystem-bins-${{ github.sha }}
      # Makefile and bats helpers resolve bin paths via `go env GOOS/GOARCH`.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          cache: false
          check-latest: true
          go-version-file: .go-version
      - uses: ./.github/actions/setup-ecosystem-tools
        with:
          with-docker: "true"
          with-haproxy: "true"

      - uses: ./.github/actions/setup-localstack
      - name: Run cloud scale-out DynamoDB tests
        id: dynamodb_scale
        run: |
          make run-cloud-scale-out-tests USE_PREBUILT=1
        env:
          AWS_ACCESS_KEY_ID: fake
          AWS_SECRET_ACCESS_KEY: fake
        continue-on-error: true
      - uses: ./.github/actions/scale-out-collect-results
        if: always()
        with:
          scale-outcome: ${{ steps.dynamodb_scale.outcome }}
          logs-search-path: /tmp/zot-ft-logs
          zot-logs-artifact-name: zot-scale-out-dynamodb-logs
          zot-logs-artifact-path: /tmp/zot-ft-logs
          zb-results-artifact-name: zb-cloud-scale-out-dynamodb-results-${{ github.sha }}
          fail-message: DynamoDB scale-out tests failed
      - uses: ./.github/actions/teardown-localstack
        if: always()

  scale-out-redis:
    name: Cloud scale-out Redis
    needs: build
    runs-on: cncf-ubuntu-32-128-x86
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-prebuilt-binaries
        with:
          artifact-name: ecosystem-bins-${{ github.sha }}
      # Makefile and bats helpers resolve bin paths via `go env GOOS/GOARCH`.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          cache: false
          check-latest: true
          go-version-file: .go-version
      - uses: ./.github/actions/setup-ecosystem-tools
        with:
          with-docker: "true"
          with-haproxy: "true"
          with-valkey: "true"

      - uses: ./.github/actions/setup-localstack
      - name: Run cloud scale-out Redis tests
        id: redis_scale
        run: |
          make run-cloud-scale-out-redis-tests USE_PREBUILT=1
        env:
          AWS_ACCESS_KEY_ID: fake
          AWS_SECRET_ACCESS_KEY: fake
        continue-on-error: true
      - uses: ./.github/actions/scale-out-collect-results
        if: always()
        with:
          scale-outcome: ${{ steps.redis_scale.outcome }}
          logs-search-path: /tmp/zot-ft-logs/redis
          zot-logs-artifact-name: zot-scale-out-redis-logs
          zot-logs-artifact-path: /tmp/zot-ft-logs
          zb-results-artifact-name: zb-cloud-scale-out-redis-results-${{ github.sha }}
          fail-message: Redis scale-out tests failed
      - uses: ./.github/actions/teardown-localstack
        if: always()

  # Aggregator whose job name matches the pre-refactor required status check.
  client-tools:
    name: Check client tools
    if: ${{ always() }}
    needs:
      - blackbox-ci
      - blackbox-cloud
      - scale-out-dynamodb
      - scale-out-redis
    runs-on: ubuntu-latest
    steps:
      - name: Confirm all ecosystem jobs succeeded
        run: |
          set -euo pipefail
          ok=true
          check() {
            echo "$1: $2"
            if [ "$2" != "success" ]; then
              ok=false
            fi
          }
          check blackbox-ci "${{ needs.blackbox-ci.result }}"
          check blackbox-cloud "${{ needs.blackbox-cloud.result }}"
          check scale-out-dynamodb "${{ needs.scale-out-dynamodb.result }}"
          check scale-out-redis "${{ needs.scale-out-redis.result }}"
          "${ok}"
