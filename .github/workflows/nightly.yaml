name: 'Nightly jobs'
on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:

permissions: read-all

#  The following tests are run:
#  1. run zot with local storage and dedupe disabled, push images, restart zot with dedupe enabled
#  task scheduler will start a dedupe all blobs process at zot startup and it shouldn't interfere with clients.
#  2. run zot with s3 storage and dynamodb and dedupe enabled, push images, restart zot with dedupe false and no cache
#  task scheduler will start a restore all blobs process at zot startup, after it finishes all blobs should be restored to their original state (have content)
#  3. run many, many, many instances of zot with shared storage and metadata front-ended by HAProxy. start a long-running zb run with high concurrency and number of requests
#  to achieve a long-running sustained load on the system. The system is expected to perform well without errors and return performance data after the test.
jobs:
  build-binaries:
    name: Build binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/build-zot-binaries
        with:
          # Shared zot/zb + blackbox client tools (incl. skopeo) so parallel jobs
          # reuse the artifact instead of each re-downloading check-blackbox tools.
          make-targets: binary binary-minimal bench blackbox-tools
          with-skopeo-build-deps: "true"
          artifact-path: |
            bin/
            hack/tools/

  dedupe:
    name: Dedupe/restore blobs
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          check-latest: true
          go-version-file: .go-version
      - uses: ./.github/actions/install-prebuilt-binaries
      - uses: ./.github/actions/setup-localstack
      - name: Run blackbox nightly dedupe tests
        run: |
            # test restoring s3 blobs after cache is deleted
            # test deduping filesystem blobs after switching dedupe to enable
            make USE_PREBUILT=1 run-blackbox-dedupe-nightly
        env:
          AWS_ACCESS_KEY_ID: fake
          AWS_SECRET_ACCESS_KEY: fake
      - uses: ./.github/actions/teardown-localstack
        if: always()

  sync:
    name: Sync harness
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - name: Check out source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          check-latest: true
          go-version-file: .go-version
      - uses: ./.github/actions/install-prebuilt-binaries
      - name: Run sync harness
        run: |
            make USE_PREBUILT=1 run-blackbox-sync-nightly

  gc-referrers-stress-s3:
    name: GC(with referrers) on S3(localstack) with short interval
    needs: build-binaries
    runs-on: cncf-ubuntu-16-64-x86
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-prebuilt-binaries
      - uses: ./.github/actions/setup-localstack
      - name: Create zot-storage bucket on LocalStack
        run: |
          awslocal s3api create-bucket --bucket zot-storage --region us-east-2 \
            --create-bucket-configuration='{"LocationConstraint": "us-east-2"}'
        env:
          AWS_ACCESS_KEY_ID: fake
          AWS_SECRET_ACCESS_KEY: fake
      - name: Run zb
        timeout-minutes: 240
        id: bench
        run: |
            ./bin/zot-linux-amd64 serve test/gc-stress/config-gc-referrers-bench-s3-localstack.json &
            sleep 10
            bin/zb-linux-amd64 -c 10 -n 100 -o ci-cd http://localhost:8080 --skip-cleanup

            killall --wait -r zot-*

            # clean zot storage
            sudo rm -rf /tmp/zot
        env:
          AWS_ACCESS_KEY_ID: fake
          AWS_SECRET_ACCESS_KEY: fake
        continue-on-error: true

      - uses: ./.github/actions/teardown-localstack
        if: always()
      - name: Check on failures
        if: ${{ steps.bench.outcome != 'success' }}
        run: |
          cat /tmp/gc-referrers-bench-s3.log
          exit 1

  gc-stress-s3:
    name: GC(without referrers) on S3(localstack) with short interval
    needs: build-binaries
    runs-on: cncf-ubuntu-16-64-x86
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-prebuilt-binaries
      - uses: ./.github/actions/setup-localstack
      - name: Create zot-storage bucket on LocalStack
        run: |
          awslocal s3api create-bucket --bucket zot-storage --region us-east-2 \
            --create-bucket-configuration='{"LocationConstraint": "us-east-2"}'
        env:
          AWS_ACCESS_KEY_ID: fake
          AWS_SECRET_ACCESS_KEY: fake
      - name: Run zb
        timeout-minutes: 240
        id: bench
        run: |
            ./bin/zot-linux-amd64 serve test/gc-stress/config-gc-bench-s3-localstack.json &
            sleep 10
            bin/zb-linux-amd64 -c 10 -n 100 -o ci-cd http://localhost:8080 --skip-cleanup

            killall --wait -r zot-*

            # clean zot storage
            sudo rm -rf /tmp/zot
        env:
          AWS_ACCESS_KEY_ID: fake
          AWS_SECRET_ACCESS_KEY: fake
        continue-on-error: true

      - uses: ./.github/actions/teardown-localstack
        if: always()
      - name: Check on failures
        if: ${{ steps.bench.outcome != 'success' }}
        run: |
          cat /tmp/gc-bench-s3.log
          exit 1

  docker-image:
    name: Build docker image (for users still using Docker environments)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/clean-runner
      - name: Build image
        run: |
          make docker-image

  kind-setup:
    name: Prometheus setup
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          check-latest: true
          go-version-file: .go-version
      - uses: ./.github/actions/install-prebuilt-binaries
      - name: Log in to GitHub Docker Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Free up disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # main
      - name: Run tests
        run: |
            sudo ./scripts/enable_userns.sh
            ./examples/kind/kind-ci.sh

  kind-sync-ondemand:
    name: On-demand sync mirror regression (issue 4184)
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          check-latest: true
          go-version-file: .go-version
      - uses: ./.github/actions/install-prebuilt-binaries
      - name: Free up disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # main
      - name: Run on-demand sync mirror regression test
        run: |
          sudo ./scripts/enable_userns.sh
          make USE_PREBUILT=1 run-kind-sync-ondemand

  oidc-workload-identity:
    name: OIDC Workload Identity E2E
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          check-latest: true
          go-version-file: .go-version
      - uses: ./.github/actions/install-prebuilt-binaries
      - name: Log in to GitHub Docker Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Run OIDC workload identity tests
        run: |
            sudo ./scripts/enable_userns.sh
            ./examples/kind/kind-oidc-workload-identity.sh

  aws-secrets-manager-bearer:
    name: AWS Secrets Manager Bearer Auth E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          check-latest: true
          go-version-file: .go-version
      - name: Install crane
        run: |
          go install github.com/google/go-containerregistry/cmd/crane@latest
      - name: Run AWS Secrets Manager bearer auth tests
        run: |
          ./examples/aws-secrets-manager-bearer-auth.sh

  cloud-scale-out:
    name: s3+dynamodb scale-out
    needs: build-binaries
    runs-on: cncf-ubuntu-16-64-x86
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          cache: false
          check-latest: true
          go-version-file: .go-version
      - uses: ./.github/actions/install-prebuilt-binaries
      - name: Install haproxy
        run: sudo apt-get install -y haproxy
      - uses: ./.github/actions/setup-localstack
      - name: Run cloud scale-out high scale performance tests
        id: scale
        run: |
          make USE_PREBUILT=1 run-cloud-scale-out-high-scale-tests
        env:
          AWS_ACCESS_KEY_ID: fake
          AWS_SECRET_ACCESS_KEY: fake
        continue-on-error: true
      - uses: ./.github/actions/scale-out-collect-results
        if: always()
        with:
          scale-outcome: ${{ steps.scale.outcome }}
          logs-search-path: /tmp/zot-ft-logs/dynamo-scale
          zot-logs-artifact-name: zot-scale-out-dynamodb-logs
          zot-logs-artifact-path: /tmp/zot-ft-logs
          zb-results-artifact-name: zb-cloud-scale-out-perf-results-${{ github.sha }}
          zot-logs-if-no-files-found: error
          print-dmesg: "true"
      - uses: ./.github/actions/teardown-localstack
        if: always()

  cloud-scale-out-redis:
    name: s3+redis scale-out
    needs: build-binaries
    runs-on: cncf-ubuntu-16-64-x86
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          cache: false
          check-latest: true
          go-version-file: .go-version
      - uses: ./.github/actions/install-prebuilt-binaries
      - name: Install haproxy
        run: sudo apt-get install -y haproxy
      - uses: ./.github/actions/setup-localstack
      - name: Run cloud scale-out Redis tests
        id: scale
        run: |
          make USE_PREBUILT=1 run-cloud-scale-out-redis-high-scale-tests
        env:
          AWS_ACCESS_KEY_ID: fake
          AWS_SECRET_ACCESS_KEY: fake
        continue-on-error: true
      - uses: ./.github/actions/scale-out-collect-results
        if: always()
        with:
          scale-outcome: ${{ steps.scale.outcome }}
          logs-search-path: /tmp/zot-ft-logs/redis-scale
          zot-logs-artifact-name: zot-scale-out-redis-logs
          zot-logs-artifact-path: /tmp/zot-ft-logs/redis-scale
          zb-results-artifact-name: zb-cloud-scale-out-redis-results-${{ github.sha }}
          zot-logs-if-no-files-found: error
          print-dmesg: "true"
      - uses: ./.github/actions/teardown-localstack
        if: always()
